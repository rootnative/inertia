packages:
  - 'packages/*'
  - 'example'
  - 'docs'

# Metro/RN tooling assumes a flat node_modules; pnpm >=10 reads settings from
# this file (the same settings in .npmrc are kept for older pnpm versions).
nodeLinker: hoisted
shamefullyHoist: true
strictPeerDependencies: false
autoInstallPeers: true
engineStrict: true
