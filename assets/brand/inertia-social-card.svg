<!--
  Open Graph / Twitter card, 1200x630. Text is baked into the raster output,
  so the font stack only has to resolve on the machine running this script.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <title>Inertia — declarative animation primitives for React Native</title>
  <defs>
    <linearGradient id="cardMark" gradientUnits="userSpaceOnUse" x1="110" y1="297" x2="286" y2="120">
      <stop offset="0" stop-color="#f472b6" />
      <stop offset="0.55" stop-color="#8b8ff9" />
      <stop offset="1" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="cardBar" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0" stop-color="#f472b6" />
      <stop offset="0.55" stop-color="#8b8ff9" />
      <stop offset="1" stop-color="#818cf8" />
    </linearGradient>
    <radialGradient id="cardGlow" gradientUnits="userSpaceOnUse" cx="1020" cy="110" r="560">
      <stop offset="0" stop-color="#4f46e5" stop-opacity="0.34" />
      <stop offset="0.55" stop-color="#ec4899" stop-opacity="0.09" />
      <stop offset="1" stop-color="#0b0b0f" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#0b0b0f" />
  <g transform="translate(0 0)">
    <rect width="1200" height="630" fill="#0b0b0f" />
    <rect width="1200" height="630" fill="url(#cardGlow)" />
    <rect y="625" width="1200" height="5" fill="url(#cardBar)" />

    <g transform="translate(96 96) scale(3.2)" fill="url(#cardMark)">
      <rect x="4.5" y="31.5" width="25" height="25" rx="8" opacity="0.3" />
      <rect x="15.5" y="19.5" width="29" height="29" rx="9" opacity="0.6" />
      <rect x="26.5" y="7.5" width="33" height="33" rx="10.5" />
    </g>

    <text x="110" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="96" font-weight="700" letter-spacing="-3" fill="#fafafa">Inertia</text>
    <text x="110" y="436" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="500" fill="#a1a1aa">Declarative animation primitives for React Native</text>
    <text x="110" y="512" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="500" letter-spacing="0.4" fill="#71717a">@rootnative/inertia</text>
  </g>
</svg>
