# Keep the GitHub Actions SHA pins and the npm dependencies current.
# Actions are pinned to commit SHAs in .github/workflows/*.yml; Dependabot
# updates the SHA and the version comment together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # The runtime is pinned across every RootNative project: React 19.1,
      # React Native 0.81, Expo SDK 54, Reanimated 4.1. Bump these by hand.
      - dependency-name: react
      - dependency-name: react-native
      - dependency-name: react-native-reanimated
      - dependency-name: react-native-worklets
      - dependency-name: expo*
      - dependency-name: '@expo/*'
