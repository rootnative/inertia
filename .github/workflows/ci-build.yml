name: CI / Build & Test

# Run whenever a change could affect what this workflow checks.
#
# `example/**` and `docs/**` are in the list because both packages define a
# `typecheck` script, so `pnpm run typecheck` (turbo, all packages) covers
# them. Leaving them out meant an example- or docs-only change that broke
# typecheck sailed through review and only failed later in deploy-web.yml on
# main. A prose-only docs edit now pays a full run; that is the price of the
# filter being obviously correct rather than cleverly minimal
on:
  push:
    branches:
      - main
    paths:
      - "packages/**"
      - "example/**"
      - "docs/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "tsconfig.base.json"
      - "tsconfig.json"
      - "jest.config.js"
      - "jest.setup.js"
      - ".nvmrc"
      - ".github/workflows/ci-build.yml"
  pull_request:
    paths:
      - "packages/**"
      - "example/**"
      - "docs/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "tsconfig.base.json"
      - "tsconfig.json"
      - "jest.config.js"
      - "jest.setup.js"
      - ".nvmrc"
      - ".github/workflows/ci-build.yml"

# The token only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Typecheck, test, size
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build packages
        run: pnpm run build

      - name: Bundle-size check (core)
        run: pnpm --filter @rootnative/inertia size

      - name: Bundle-size check (gradients)
        run: pnpm --filter @rootnative/inertia-gradients size

      # Compile the docs site so malformed MDX, a broken internal link
      # (`onBrokenLinks: 'throw'`), or a bad Docusaurus config fails the PR
      # instead of surfacing after merge in deploy-web.yml — the only place
      # that used to build the site at all.
      #
      # This deliberately skips `prepare:demo`, which shells out to
      # `npx expo export --platform web`. That export is what makes the real
      # docs build slow, and nothing about it validates content: the demo is
      # referenced as an iframe `src`, so its absence doesn't affect
      # compilation. Skipping it takes this step to ~25s. deploy-web.yml still
      # runs the full `docs:build` with the export for the published site.
      - name: Docs build check
        run: pnpm run docs:check
