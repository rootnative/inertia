name: CI / Format & Lint

# Formatting, lint, and the version-consistency guard cover the whole repo
# (format:check scans **/*.md, check:versions reads READMEs / CHANGELOGs /
# docs), so this workflow has no path filter — it runs on every push and pull
# request. ci-build.yml is path-filtered to packages/**, which would skip the
# doc files version drift actually shows up in; that's why the guard lives
# here and not there.
on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-lint:
    name: Format & lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      # Guards against the drift that shipped in 0.0.2: adapter CHANGELOGs
      # stuck at the previous version, stale compare links, and README / docs
      # status lines naming a version that is no longer current. Most of it is
      # repairable with `pnpm run check:versions:fix`.
      - name: Version consistency
        run: pnpm run check:versions

      # `docs/static/llms-full.txt` and every `packages/*/llms.txt` are
      # generated from `docs/docs/*`. Fixing a source page (or letting
      # `check:versions:fix` rewrite a status line) without re-running the
      # generator leaves the committed copies behind — which is how 0.0.3
      # shipped an llms-full.txt still announcing 0.0.2. Regenerate and fail if
      # anything moved; the fix is `pnpm run build:llms` plus a commit.
      - name: Generated llms.txt files are up to date
        run: |
          pnpm run build:llms
          if ! git diff --exit-code -- '**/llms.txt' '**/llms-full.txt'; then
            echo "::error::Generated llms files are stale. Run 'pnpm run build:llms' and commit the result."
            exit 1
          fi
