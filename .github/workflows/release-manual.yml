name: Release (Manual)

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Package dirs to publish (comma-separated, e.g. "core" or "core,gestures")'
        required: true
        type: string
      version:
        description: 'Version bump type (ignored if custom_version is set)'
        required: false
        type: choice
        default: 'skip'
        options:
          - skip
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor
          - prerelease
      custom_version:
        description: 'Custom version (e.g. "1.2.3" or "1.0.0-beta.1"). Overrides version bump type.'
        required: false
        type: string
      preid:
        description: 'Pre-release identifier (e.g. alpha, beta, rc). Only used with pre* version types.'
        required: false
        default: 'alpha'
        type: string
      tag:
        description: 'npm dist-tag'
        required: true
        type: choice
        options:
          - latest
          - alpha
          - beta
          - rc

jobs:
  release:
    name: Release (Manual)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: 'pnpm'

      # Pinned to a major rather than `@latest`. An unpinned upgrade silently
      # re-versions the release path on every run: `npm version <same-version>`
      # was a no-op through the 0.0.4 release and became a hard error two days
      # later, which broke the first two 0.0.5 attempts with no repo change.
      - name: Upgrade npm (OIDC trusted publishing requires >=11.5.1)
        run: npm install -g npm@11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate inputs
        run: |
          if [ -z "${{ inputs.custom_version }}" ] && [ "${{ inputs.version }}" = "skip" ]; then
            echo "::error::Either set a custom_version or select a version bump type."
            exit 1
          fi

      - name: Validate packages exist and are public
        id: packages
        run: |
          IFS=',' read -ra PKGS <<< "${{ inputs.packages }}"
          VALIDATED=""
          for PKG in "${PKGS[@]}"; do
            PKG=$(echo "$PKG" | xargs) # trim whitespace
            PKG_JSON="packages/$PKG/package.json"
            if [ ! -f "$PKG_JSON" ]; then
              echo "::error::Package directory 'packages/$PKG' not found."
              exit 1
            fi
            IS_PRIVATE=$(node -p "require('./$PKG_JSON').private ?? false")
            if [ "$IS_PRIVATE" = "true" ]; then
              echo "::error::Package '$PKG' is private and cannot be published."
              exit 1
            fi
            VALIDATED="$VALIDATED $PKG"
          done
          VALIDATED=$(echo "$VALIDATED" | xargs) # trim leading space
          echo "packages=$VALIDATED" >> "$GITHUB_OUTPUT"
          echo "Validated packages: $VALIDATED"

      # Same quality gates as release.yml. This workflow used to run only
      # `build` before publishing — and because it is the workflow that
      # actually cuts releases (every tag in history has its `+`-joined
      # label), that meant the published path was the *unverified* one.
      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      # Bundle-size regression guard, matching ci-build.yml. Only core and
      # gradients define a `size` script; both are built by `pnpm run build`
      # above regardless of which subset is being published, so this runs
      # unconditionally rather than trying to match it to `inputs.packages`.
      - name: Bundle-size check (core)
        run: pnpm --filter @rootnative/inertia size

      - name: Bundle-size check (gradients)
        run: pnpm --filter @rootnative/inertia-gradients size

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump versions
        id: version
        run: |
          CUSTOM_VERSION="${{ inputs.custom_version }}"
          NEW_VERSION=""

          for PKG_DIR in ${{ steps.packages.outputs.packages }}; do
            if [ -n "$CUSTOM_VERSION" ]; then
              # `--allow-same-version` because the CHANGELOG entry and the
              # version bump are prepared in one commit before the release is
              # triggered (see the tag history), so the tree is normally already
              # at the target version by the time this runs.
              (cd "packages/$PKG_DIR" && npm version "$CUSTOM_VERSION" --no-git-tag-version --allow-same-version)
              NEW_VERSION="$CUSTOM_VERSION"
            else
              VERSION_ARGS="${{ inputs.version }}"
              if [[ "$VERSION_ARGS" == pre* ]]; then
                VERSION_ARGS="$VERSION_ARGS --preid ${{ inputs.preid }}"
              fi
              (cd "packages/$PKG_DIR" && npm version $VERSION_ARGS --no-git-tag-version)
              NEW_VERSION=$(node -p "require('./packages/$PKG_DIR/package.json').version")
            fi
          done

          # Update @rootnative/inertia peer dep in selected packages if core was bumped
          CORE_BUMPED=false
          for PKG_DIR in ${{ steps.packages.outputs.packages }}; do
            if [ "$PKG_DIR" = "core" ]; then CORE_BUMPED=true; break; fi
          done

          if [ "$CORE_BUMPED" = true ]; then
            CORE_VERSION=$(node -p "require('./packages/core/package.json').version")
            for PKG_DIR in ${{ steps.packages.outputs.packages }}; do
              node -e "
                const fs = require('fs');
                const pkgPath = 'packages/$PKG_DIR/package.json';
                const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
                if (pkg.peerDependencies?.['@rootnative/inertia']) {
                  pkg.peerDependencies['@rootnative/inertia'] = '>=$CORE_VERSION';
                  fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');
                }
              "
            done
          fi

          # Update lockfile after version bumps
          pnpm install --no-frozen-lockfile

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      # Repair the version references the bump just invalidated (CHANGELOG
      # compare links, README / docs status lines).
      #
      # This MUST run before `build:llms`. `docs/static/llms-full.txt` is
      # generated from `docs/docs/index.mdx`, so generating first captured the
      # pre-fix status line and shipped it: the 0.0.3 tag carries an
      # llms-full.txt announcing 0.0.2 for exactly this reason.
      - name: Sync version references
        run: pnpm run check:versions:fix

      - name: Regenerate LLM docs with new versions
        run: pnpm run build:llms

      # Verify last, against the synced sources and freshly generated docs.
      # Hard-fails if a CHANGELOG has no `## [<new version>]` section — the one
      # thing that can't be generated. Cut the changelog entry before releasing.
      #
      # NOTE: publishing a SUBSET here takes the packages out of lockstep, and
      # `check:versions` will fail on the packages left behind — by design, so
      # a partial release is a deliberate, visible act. Bump the rest (or use
      # release.yml) to restore lockstep.
      - name: Verify version references
        run: pnpm run check:versions

      - name: Commit and tag
        run: |
          # Build tag from package names and version
          PKGS_LABEL=$(echo "${{ inputs.packages }}" | tr ',' '+')
          TAG="${PKGS_LABEL}@${{ steps.version.outputs.version }}"

          git add pnpm-lock.yaml
          git add packages/*/llms.txt docs/static/llms-full.txt
          # Every file `check:versions:fix` can rewrite has to be staged here,
          # or the repair is silently dropped and CI fails on main right after
          # the push. `packages/*/README.md` is in the list because the core
          # README carries a status line (it ships as the npm package page).
          git add packages/*/CHANGELOG.md packages/*/README.md README.md docs/docs/index.mdx
          for PKG_DIR in ${{ steps.packages.outputs.packages }}; do
            git add "packages/$PKG_DIR/package.json"
          done
          # Nothing may be staged: if the bump commit already carried the
          # version bump and the synced references, `check:versions:fix` finds
          # nothing to repair. That is the normal path, not an error — the tag
          # still has to be cut, so only skip the commit.
          git diff --staged --quiet || git commit -m "release: ${TAG}"
          git tag "$TAG"

          echo "tag=$TAG" >> "$GITHUB_ENV"

      - name: Publish packages
        run: |
          # Publish core first if included (other packages may depend on @rootnative/inertia)
          for PKG_DIR in ${{ steps.packages.outputs.packages }}; do
            if [ "$PKG_DIR" = "core" ]; then
              echo "Publishing @rootnative/inertia..."
              (cd packages/core && pnpm publish --provenance --access public --tag ${{ inputs.tag }} --no-git-checks)
              break
            fi
          done

          # Publish remaining packages
          for PKG_DIR in ${{ steps.packages.outputs.packages }}; do
            if [ "$PKG_DIR" = "core" ]; then continue; fi
            PKG_NAME=$(node -p "require('./packages/$PKG_DIR/package.json').name")
            echo "Publishing $PKG_NAME..."
            (cd "packages/$PKG_DIR" && pnpm publish --provenance --access public --tag ${{ inputs.tag }} --no-git-checks)
          done

      - name: Push to main
        run: |
          git push origin main
          git push origin "${{ env.tag }}"
