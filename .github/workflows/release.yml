name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor
          - prerelease
      preid:
        description: 'Pre-release identifier (e.g. alpha, beta, rc). Only used with pre* version types.'
        required: false
        default: 'alpha'
        type: string
      tag:
        description: 'npm dist-tag'
        required: true
        type: choice
        options:
          - latest
          - alpha
          - beta
          - rc

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: 'pnpm'

      # Pinned to a major rather than `@latest`. An unpinned upgrade silently
      # re-versions the release path on every run: `npm version <same-version>`
      # was a no-op through the 0.0.4 release and became a hard error two days
      # later, which broke the first two 0.0.5 attempts with no repo change.
      - name: Upgrade npm (OIDC trusted publishing requires >=11.5.1)
        run: npm install -g npm@11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      # Bundle-size regression guard, matching ci-build.yml. Only core and
      # gradients define a `size` script.
      - name: Bundle-size check (core)
        run: pnpm --filter @rootnative/inertia size

      - name: Bundle-size check (gradients)
        run: pnpm --filter @rootnative/inertia-gradients size

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Discover public packages
        id: packages
        run: |
          # Find all non-private packages under packages/
          PUBLIC_PKGS=$(node -e "
            const fs = require('fs');
            const path = require('path');
            const dirs = fs.readdirSync('packages', { withFileTypes: true })
              .filter(d => d.isDirectory())
              .map(d => d.name)
              .filter(name => {
                const pkgPath = path.join('packages', name, 'package.json');
                if (!fs.existsSync(pkgPath)) return false;
                const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
                return pkg.private !== true;
              })
              .sort();
            // core first, then adapters — this is the publish order (adapters
            // peer-depend on core) AND the order the release tag label is
            // built from. scripts/check-versions.mjs derives the same order,
            // so the generated CHANGELOG links match the tag that gets cut.
            const ordered = ['core', ...dirs.filter(d => d !== 'core')];
            console.log(ordered.join(' '));
          ")
          echo "packages=$PUBLIC_PKGS" >> "$GITHUB_OUTPUT"
          echo "Discovered public packages: $PUBLIC_PKGS"

      - name: Bump versions
        id: version
        run: |
          VERSION_ARGS="${{ inputs.version }}"
          if [[ "$VERSION_ARGS" == pre* ]]; then
            VERSION_ARGS="$VERSION_ARGS --preid ${{ inputs.preid }}"
          fi

          NEW_VERSION=""
          for PKG_DIR in ${{ steps.packages.outputs.packages }}; do
            (cd "packages/$PKG_DIR" && npm version $VERSION_ARGS --no-git-tag-version)
            if [ -z "$NEW_VERSION" ]; then
              NEW_VERSION=$(node -p "require('./packages/$PKG_DIR/package.json').version")
            fi
          done

          # Update @rootnative/inertia peer dep in any package that references it
          for PKG_DIR in ${{ steps.packages.outputs.packages }}; do
            node -e "
              const fs = require('fs');
              const pkgPath = 'packages/$PKG_DIR/package.json';
              const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
              if (pkg.peerDependencies?.['@rootnative/inertia']) {
                pkg.peerDependencies['@rootnative/inertia'] = '>=$NEW_VERSION';
                fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');
              }
            "
          done

          # Update lockfile after version bumps
          pnpm install --no-frozen-lockfile

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      # Bumping package.json invalidates every version reference around it:
      # CHANGELOG compare links, and the README / docs status lines. --fix
      # repairs those mechanically.
      #
      # This MUST run before `build:llms`. `docs/static/llms-full.txt` is
      # generated from `docs/docs/index.mdx`, so generating first captured the
      # pre-fix status line and shipped it: the 0.0.3 tag carries an
      # llms-full.txt announcing 0.0.2 for exactly this reason.
      - name: Sync version references
        run: pnpm run check:versions:fix

      - name: Regenerate LLM docs with new versions
        run: pnpm run build:llms

      # Verify last, against the synced sources and freshly generated docs.
      # Hard-fails if a CHANGELOG is missing a `## [<new version>]` section —
      # the one thing that can't be generated. Cut the changelog entry before
      # running a release; that's already the established order (see history).
      - name: Verify version references
        run: pnpm run check:versions

      - name: Commit and tag
        run: |
          # Tag the whole lockstep release under one `+`-joined label, matching
          # every tag already in git history and the compare links generated
          # into the CHANGELOG footers. Do not switch this to `v<version>` —
          # release-manual.yml and check-versions.mjs both build the same shape.
          PKGS_LABEL=$(echo "${{ steps.packages.outputs.packages }}" | tr ' ' '+')
          TAG="${PKGS_LABEL}@${{ steps.version.outputs.version }}"

          git add pnpm-lock.yaml
          git add packages/*/llms.txt docs/static/llms-full.txt
          # Every file `check:versions:fix` can rewrite has to be staged here,
          # or the repair is silently dropped and CI fails on main right after
          # the push. `packages/*/README.md` is in the list because the core
          # README carries a status line (it ships as the npm package page).
          git add packages/*/CHANGELOG.md packages/*/README.md README.md docs/docs/index.mdx
          for PKG_DIR in ${{ steps.packages.outputs.packages }}; do
            git add "packages/$PKG_DIR/package.json"
          done
          # Nothing may be staged: if the bump commit already carried the
          # version bump and the synced references, `check:versions:fix` finds
          # nothing to repair. That is the normal path, not an error — the tag
          # still has to be cut, so only skip the commit.
          git diff --staged --quiet || git commit -m "release: ${TAG}"
          git tag "$TAG"

          echo "tag=$TAG" >> "$GITHUB_ENV"

      - name: Publish packages
        run: |
          # Publish core first (other packages may depend on @rootnative/inertia)
          if [ -d packages/core ]; then
            echo "Publishing @rootnative/inertia..."
            (cd packages/core && pnpm publish --provenance --access public --tag ${{ inputs.tag }} --no-git-checks)
          fi

          # Publish remaining packages
          for PKG_DIR in ${{ steps.packages.outputs.packages }}; do
            if [ "$PKG_DIR" = "core" ]; then continue; fi
            PKG_NAME=$(node -p "require('./packages/$PKG_DIR/package.json').name")
            echo "Publishing $PKG_NAME..."
            (cd "packages/$PKG_DIR" && pnpm publish --provenance --access public --tag ${{ inputs.tag }} --no-git-checks)
          done

      - name: Push to main
        run: |
          git push origin main
          git push origin "${{ env.tag }}"

      - name: Create GitHub Release
        run: |
          PRERELEASE_FLAG=""
          if [[ "${{ inputs.tag }}" != "latest" ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "${{ env.tag }}" --generate-notes $PRERELEASE_FLAG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
