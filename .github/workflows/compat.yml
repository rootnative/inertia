name: CI / SDK Compatibility

# Checks the packed release candidate against every Expo SDK fixture in
# rootnative/sdk-compat, before it is published rather than after.
#
# This exists because a green test suite here says nothing about what a
# consumer can install. Two failures got through that gap: `0.0.10` declares
# `react-native >=0.81.0` and `react-native-reanimated >=4.0.0`, and the newest
# Reanimated that range admits requires `react-native 0.83 - 0.87`, so npm
# rejects our own advertised floor with ERESOLVE. Nothing in this repository
# changed when that became true — Reanimated narrowed its own range.
on:
  push:
    branches:
      - main
    paths:
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/compat.yml"
  pull_request:
    paths:
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/compat.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pack:
    name: Pack candidate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The tarball has to be built, not just packed: `files` ships `dist`, and
      # the web export condition resolves to it. Packing an unbuilt tree would
      # test a package that has no `dist` at all.
      - name: Build
        run: pnpm run build

      - name: Pack core
        run: pnpm --filter @rootnative/inertia pack --pack-destination pack

      - name: Upload candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-inertia
          path: pack/*.tgz
          if-no-files-found: error
          retention-days: 1

  compat:
    name: Matrix
    needs: pack
    uses: rootnative/sdk-compat/.github/workflows/compat.yml@main
    with:
      package: "@rootnative/inertia"
      tarball-artifact: candidate-inertia
      # Enforced. The ranges were narrowed to the SDK 57 band, which is the
      # widest set that admits no combination npm would reject.
      enforce-range: true
